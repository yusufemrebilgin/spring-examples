<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Chat Room</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 90%;
            max-width: 600px;
            height: 80vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 1.5em;
            font-weight: bold;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
        }

        .message {
            margin-bottom: 15px;
            padding: 10px 15px;
            border-radius: 10px;
            max-width: 70%;
            word-wrap: break-word;
        }

        .message.sent {
            background: #667eea;
            color: white;
            margin-left: auto;
            text-align: right;
        }

        .message.received {
            background: white;
            color: #333;
            border: 1px solid #e0e0e0;
        }

        .message.event {
            background: #fff3cd;
            color: #856404;
            text-align: center;
            margin: 10px auto;
            max-width: 80%;
            font-style: italic;
        }

        .sender-name {
            font-weight: bold;
            font-size: 0.85em;
            margin-bottom: 5px;
            opacity: 0.8;
        }

        .message-input-container {
            display: flex;
            padding: 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
        }

        .message-input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            outline: none;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .message-input:focus {
            border-color: #667eea;
        }

        .send-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            margin-left: 10px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            transition: transform 0.2s;
        }

        .send-button:hover {
            transform: scale(1.05);
        }

        .send-button:active {
            transform: scale(0.95);
        }

        .username-form {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .username-form h2 {
            color: #667eea;
            margin-bottom: 20px;
        }

        .username-input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            outline: none;
            font-size: 1em;
            margin-bottom: 20px;
        }

        .username-input:focus {
            border-color: #667eea;
        }

        .join-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 40px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
<!-- Username Form -->
<div class="username-form" id="usernameForm">
    <h2>Join Chat Room</h2>
    <input type="text" id="usernameInput" class="username-input" placeholder="Enter your name" maxlength="20">
    <button class="join-button" onclick="connect()">Join</button>
</div>

<!-- Chat Container -->
<div class="chat-container hidden" id="chatContainer">
    <div class="chat-header">
        WebSocket Chat Room
    </div>
    <div class="messages-container" id="messagesContainer">
    </div>
    <div class="message-input-container">
        <label for="messageInput"></label><input type="text" id="messageInput" class="message-input"
                                                 placeholder="Type a message..." onkeypress="handleKeyPress(event)">
        <button class="send-button" onclick="sendMessage()">Send</button>
    </div>
</div>

<!-- SockJS and STOMP client libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

<script>

    let stompClient = null;
    let username = null;

    // Connect to WebSocket server
    function connect() {
        username = document.getElementById('usernameInput').value.trim();

        if (!username) {
            alert('Please enter a username');
            return;
        }

        // Create a SockJS connection to the WebSocket endpoint
        const socket = new SockJS('http://localhost:8080/ws');

        // Create STOMP client over SockJS
        stompClient = Stomp.over(socket);

        // Connect to the WebSocket server
        stompClient.connect({}, onConnected, onError);
    }

    // Callback when connection is established
    function onConnected() {
        console.log('Connected to WebSocket server');

        // Subscribe to the public topic to receive messages
        stompClient.subscribe('/topic/public', onMessageReceived);

        // Send join notification to server
        stompClient.send("/app/chat/join",
            {},
            JSON.stringify({
                sender: username,
                type: 'JOIN'
            })
        );

        // Show chat container and hide username form
        document.getElementById('usernameForm').classList.add('hidden');
        document.getElementById('chatContainer').classList.remove('hidden');
        document.getElementById('messageInput').focus();
    }

    // Callback when error occurs
    function onError(error) {
        console.error('WebSocket connection error:', error);
        alert('Could not connect to server. Make sure the server is running on http://localhost:8080');
    }

    // Send chat message
    function sendMessage() {
        const messageInput = document.getElementById('messageInput');
        const messageContent = messageInput.value.trim();

        if (messageContent && stompClient) {
            const chatMessage = {
                sender: username,
                content: messageContent,
                type: 'CHAT'
            };

            // Send message to /app/chat/send
            stompClient.send("/app/chat/send", {}, JSON.stringify(chatMessage));
            messageInput.value = '';
        }
    }

    // Callback when message is received from server
    function onMessageReceived(payload) {
        const message = JSON.parse(payload.body);

        const messagesContainer = document.getElementById('messagesContainer');
        const messageElement = document.createElement('div');

        if (message.type === 'JOIN') {
            messageElement.classList.add('message', 'event');
            messageElement.textContent = `${message.sender} joined the chat`;
        } else if (message.type === 'LEAVE') {
            messageElement.classList.add('message', 'event');
            messageElement.textContent = `${message.sender} left the chat`;
        } else {
            messageElement.classList.add('message');

            // Add 'sent' class if message is from current user, otherwise 'received'
            if (message.sender === username) {
                messageElement.classList.add('sent');
            } else {
                messageElement.classList.add('received');
                const senderElement = document.createElement('div');
                senderElement.classList.add('sender-name');
                senderElement.textContent = message.sender;
                messageElement.appendChild(senderElement);
            }

            const contentElement = document.createElement('div');
            contentElement.textContent = message.content;
            messageElement.appendChild(contentElement);
        }

        messagesContainer.appendChild(messageElement);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    // Handle Enter key press in message input
    function handleKeyPress(event) {
        if (event.key === 'Enter') {
            sendMessage();
        }
    }

    // Handle Enter key press in username input
    document.getElementById('usernameInput').addEventListener('keypress', function (event) {
        if (event.key === 'Enter') {
            connect();
        }
    });

    // Disconnect when page is closed
    window.addEventListener('beforeunload', function () {
        if (stompClient !== null) {
            stompClient.disconnect();
        }
    });
</script>
</body>
</html>
